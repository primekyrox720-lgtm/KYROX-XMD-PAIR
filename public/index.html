<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyrox-MD • Pair Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover { background: #0369a1; }
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #0f172a;
            border-radius: 10px;
            border: 1px dashed #38bdf8;
        }
        .code {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: #38bdf8;
            margin: 10px 0;
            user-select: all;
        }
        .info-text { font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h1>KYROX-MD</h1>
    <p class="subtitle">Générateur de Session & Pair Code WhatsApp</p>

    <input type="text" id="phone" placeholder="Ex: 50931234567 (sans +)">
    <button id="btn" onclick="getCode()">Obtenir le code</button>

    <div class="result-box" id="result">
        <p class="info-text">Saisissez ce code dans vos notifications WhatsApp :</p>
        <div class="code" id="code-display">--------</div>
        <p class="info-text">Une fois validé, votre <b>SESSION_ID</b> vous sera envoyé en message privé sur WhatsApp !</p>
    </div>
</div>

<script>
    async function getCode() {
        const phone = document.getElementById("phone").value.trim();
        const btn = document.getElementById("btn");
        const result = document.getElementById("result");
        const codeDisplay = document.getElementById("code-display");

        if (!phone) {
            alert("Veuillez entrer votre numéro de téléphone.");
            return;
        }

        btn.innerText = "Génération...";
        btn.disabled = true;

        try {
            const res = await fetch("/api/pair-code", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ phone })
            });

            const data = await res.json();
            if (data.success) {
                result.style.display = "block";
                codeDisplay.innerText = data.code;
            } else {
                alert(data.error || "Une erreur est survenue.");
            }
        } catch (e) {
            alert("Erreur de connexion au serveur.");
        } finally {
            btn.innerText = "Obtenir le code";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
